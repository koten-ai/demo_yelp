# Local / staging-shaped stack: API + nginx SPA.
# Default backend target is **monorepo**: kotenai-zeus-client 0.3.1-alpha
# archived from the sibling repo tag (the working tree is client 2.x).
# Release git-tag pin over SSH instead:
#   target: release + context: .  (see comments on backend.build)
#   docker compose up --build
# Vite HMR (optional):
#   docker compose --profile dev up --build

services:
  backend:
    build:
      # Monorepo (default): 0.3.1-alpha from the sibling clone, no GitHub SSH.
      context: ..
      dockerfile: demo_yelp/Dockerfile.backend
      target: monorepo
      args:
        ZEUS_CLIENT_TREE_REF: "0.3.1-alpha"
      # Release pin instead (needs SSH agent for private client repo):
      #   context: .
      #   dockerfile: Dockerfile.backend
      #   target: release
      #   ssh: [default]
      #   args:
      #     ZEUS_CLIENT_GIT_REF: "0.3.0-alpha"
    image: local-guide-backend:local
    container_name: local-guide-backend
    ports:
      - "5000:5000"
    environment:
      ENVIRONMENT: dev
      ZEUS_URL: "http://host.docker.internal:8080"
      CHAT_LOG_PATH: "/app/data/chats.jsonl"
      ZEUS_CLIENT_CONFIG_DIR: "/app"
      ZEUS_CHAT_REQUESTS_DIR: "/app/data/chat_requests"
      # Fast-tier suggest N1QL hydrate (FTS src_keys → business cards)
      COUCHBASE_QUERY_URL: "http://host.docker.internal:8093"
      COUCHBASE_USERNAME: "Administrator"
      COUCHBASE_PASSWORD: "password"
      PORT: "5000"
      BUSINESS_IMAGES_BASE_URL: "https://koten-yelp-demo-photos.nyc3.cdn.digitaloceanspaces.com/business-images"
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./src/local_guide:/app/src/local_guide
      # AI-generated top-business photos (served at /business-images).
      - ./frontend/public/business-images:/app/frontend/public/business-images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: local-guide-frontend:local
    container_name: local-guide-frontend
    ports:
      # Host 3000 — avoid clashing with local Zeus on :8080.
      - "3000:80"
    environment:
      BACKEND_UPSTREAM: "http://backend:5000"
      NGINX_ENVSUBST_FILTER: "BACKEND_"
    depends_on:
      - backend
    restart: unless-stopped

  # Vite HMR — bind-mounts source; does not use Dockerfile.frontend.
  #   docker compose --profile dev up --build
  frontend-dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: local-guide-frontend-dev
    working_dir: /fe
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: "http://backend:5000"
      VITE_USE_POLLING: "1"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/fe
      - frontend_node_modules:/fe/node_modules
    command: >-
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
