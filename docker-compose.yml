services:
  local-guide:
    build:
      context: ..
      dockerfile: demo_yelp/Dockerfile
    container_name: local-guide
    ports:
      - "5000:5000"
    environment:
      ENVIRONMENT: dev
      ZEUS_URL: "http://host.docker.internal:8080"
      CHAT_LOG_PATH: "/app/data/chats.jsonl"
      ZEUS_CLIENT_CONFIG_DIR: "/app"
      ZEUS_CHAT_REQUESTS_DIR: "/app/data/chat_requests"
      PORT: "5000"
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./src/local_guide:/app/src/local_guide
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
